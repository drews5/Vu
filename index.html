<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />

  <title>Vocal U A Cappella | University of Minnesota's Premier Gender-Inclusive Group</title>
  <meta name="description"
    content="Vocal U is the premier gender-inclusive a cappella group at the University of Minnesota. Established in 2011, we perform contemporary pop, rock, and classic arrangements in Minneapolis, MN." />
  <meta name="keywords"
    content="vocal u, vocal u a cappella, university of minnesota a cappella, umn a cappella, umn choir, a cappella group mn, minneapolis a cappella, vocal u umn" />

  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://vocalu.org/" />
  <meta property="og:title" content="Vocal U A Cappella | UMN's Gender-Inclusive Group" />
  <meta property="og:description"
    content="Gender-inclusive a cappella at the University of Minnesota. Established in 2011. Home of some of the best voices in Minneapolis." />
  <meta property="og:image" content="/favicon.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://vocalu.org/" />
  <meta property="twitter:title" content="Vocal U A Cappella" />
  <meta property="twitter:description"
    content="Gender-inclusive a cappella at the University of Minnesota. Established in 2011." />

  <!-- Structured Data (JSON-LD) for SEO -->
  <script type="application/ld+json">
        {
          "@context": "https://schema.org",
          "@type": "PerformingGroup",
          "name": "Vocal U A Cappella",
          "alternateName": "Vocal U",
          "description": "Gender-inclusive a cappella group at the University of Minnesota.",
          "url": "https://vocalu.org",
          "location": {
            "@type": "Place",
            "name": "University of Minnesota - Twin Cities",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Minneapolis",
              "addressRegion": "MN",
              "addressCountry": "US"
            }
          },
          "foundingDate": "2011"
        }
      </script>

  <style>
    .font-yearbook {
      opacity: 0;
    }

    .fonts-loaded .font-yearbook {
      opacity: 1;
      transition: opacity 0.4s ease-in-out;
    }
  </style>
  <script>
    (function () {
      const font = new FontFace('Yearbook Solid', 'url(/src/assets/fonts/yearbook_solid.woff2)');
      document.fonts.add(font);
      document.fonts.ready.then(() => {
        document.documentElement.classList.add('fonts-loaded');
      }).catch(() => {
        document.documentElement.classList.add('fonts-loaded');
      });
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
